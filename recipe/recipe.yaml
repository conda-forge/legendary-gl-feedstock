schema_version: 1

context:
  name: legendary-gl
  version: "0.21.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: e16301f3a66d3bda80a9bca54881edc2cb8868f962ebdb58314a3d62d050c9dd

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - legendary = legendary.cli:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build >=0.11.4,<0.12
  run:
    - python >=${{ python_min }}
    - filelock
    - requests
    - pycryptodomex

tests:
  - python:
      imports:
        - legendary
        - legendary.api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - legendary --help

about:
  summary: Free and open-source replacement for the Epic Games Launcher application
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/derrod/legendary

extra:
  recipe-maintainers:
    - thewchan
